name: agent-tooling

on:
  push:
  pull_request:

jobs:
  challenge-runner:
    name: Challenge runner dry-run
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build Lokad.DocxEdit.slnx -c Release --nologo -v q
      - name: List challenges
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/RunAgentChallenge.ps1 -List
      - name: Dry-run one challenge
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/RunAgentChallenge.ps1 -Challenge markup-inventory -DryRun
